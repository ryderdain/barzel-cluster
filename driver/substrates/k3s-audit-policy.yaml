# The Kubernetes API audit policy of a local cluster (ADR-0027): metadata
# level, the first rule that matches decides. The API server writes the
# records to /var/log/kubernetes/audit/audit.log on the server node; the
# in-cluster collector sends them to the admin log store. Mounted into the
# k3d server node by the substrate adapter; a change needs `down` and `up`.
#
# Metadata = who did what to which object, and when; never the request or
# response bodies, so no Secret values reach the log. Left out: the health
# and metrics endpoints, the leases that controllers renew every few
# seconds, and the events (the collector reads those as objects).
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: None
    nonResourceURLs:
      - /healthz*
      - /livez*
      - /readyz*
      - /version
      - /metrics
      - /openapi*
  - level: None
    resources:
      - group: coordination.k8s.io
        resources: [leases]
  - level: None
    resources:
      - group: ""
        resources: [events]
      - group: events.k8s.io
        resources: [events]
  - level: Metadata
