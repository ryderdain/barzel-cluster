# The conductor (kiesei bakar, ADR-0021): the kiesei image as a warm pod in the
# cluster. It runs the run-logs that the driver sends to it (driver/conductor.sh)
# and stops itself after an idle period; the next conductor phase wakes it.
#
# Rendered by driver phase 15-conductor, which replaces two sentinels:
#   __KIESEI_IMAGE__   the kiesei image reference in the substrate's registry
#   __IDLE_SECONDS__   BRZL_CONDUCTOR_IDLE_SECONDS from the environment definition
#
# Local only: the service account is cluster-admin. A cloud conductor needs only
# in-cluster permissions for its phases plus backup-bucket access (ADR-0021).
apiVersion: v1
kind: Namespace
metadata:
  name: brzl-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conductor
  namespace: brzl-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brzl-conductor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: conductor
    namespace: brzl-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conductor
  namespace: brzl-system
  labels:
    app.kubernetes.io/name: conductor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conductor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductor
    spec:
      serviceAccountName: conductor
      containers:
        - name: kiesei
          image: __KIESEI_IMAGE__
          imagePullPolicy: Always
          env:
            - name: IDLE_SECONDS
              value: "__IDLE_SECONDS__"
          # Wait for run-logs. driver/conductor.sh touches /work/run/.activity
          # on each use; after IDLE_SECONDS with no use, scale to zero.
          command: ["bash", "-c"]
          args:
            - |
              mkdir -p /work/run && touch /work/run/.activity
              printf 'conductor ready; idle limit %ss\n' "$IDLE_SECONDS"
              while sleep 30; do
                idle=$(( $(date +%s) - $(stat -c %Y /work/run/.activity) ))
                if (( idle > IDLE_SECONDS )); then
                  printf 'conductor idle for %ss; scaling to zero\n' "$idle"
                  kubectl -n brzl-system scale deployment/conductor --replicas=0
                fi
              done
          readinessProbe:
            exec:
              command: ["test", "-e", "/work/run/.activity"]
            periodSeconds: 5
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
