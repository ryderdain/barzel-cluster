# Local overlay of the Postgres cluster (the platform ApplicationSet's
# `postgres` app on local). The ApplicationSet injects the image (through Zot);
# this overlay holds the honest local deltas: one instance, local-path storage,
# and no AWS-only parts (S3 backups, the PodMonitor, the ScheduledBackup).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../operators/postgres

patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: pg
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
      - op: replace
        path: /spec/storage/storageClass
        value: local-path
      - op: remove
        path: /spec/backup
      - op: remove
        path: /spec/monitoring
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: ScheduledBackup
      name: pg-daily
    patch: |-
      $patch: delete
      apiVersion: postgresql.cnpg.io/v1
      kind: ScheduledBackup
      metadata:
        name: pg-daily
