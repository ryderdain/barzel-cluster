# AppProject scoping every local Application (same constraints as dev). A
# project (not the implicit "default") lets us constrain what these apps may
# deploy — source repo, destination cluster/namespaces, and allowed resource
# kinds — so a compromised or fat-fingered manifest can't sync arbitrary
# cluster-scoped objects.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: brzl-local
  namespace: argocd
  # Keep the project even if the app-of-apps is deleted, so child apps don't
  # orphan mid-teardown; teardown removes it explicitly.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: brzl-demo local cluster (k3d) — infrastructure, operators, applications
  sourceRepos:
    - git@github.com:ryderdain/barzel-cluster.git
    # The example app's repo (ADR-0034): private, read over https with the
    # GitHub App (the organization's repo-creds Secret, phase 25).
    - https://github.com/tzvat/chofesh.git
    # Helm chart repos the child apps render from (images come through Zot;
    # only the chart packages are fetched here).
    - https://argoproj.github.io/argo-helm
    - https://cloudnative-pg.github.io/charts
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://charts.dexidp.io
    - https://oauth2-proxy.github.io/manifests
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # PoC: allow cluster-scoped resources (CRDs, StorageClass, ClusterRoles the
  # operators need). Tighten to an explicit allowlist for prod.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
