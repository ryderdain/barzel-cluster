# Declarative registration of the dev cluster as an ArgoCD cluster Secret, so
# the platform ApplicationSet (gitops/platform/applicationset.yaml) can read
# per-cluster values from it. The labels select it and choose the AppProject
# and the AWS-only apps. The annotations carry the account-bearing values and
# are NOT committed — the bootstrap writes them at bring-up (ADR-0016, ADR-0025;
# the full list is in the ApplicationSet header):
#   brzl.dev/registry-host       <account>.dkr.ecr.<region>.amazonaws.com
#   brzl.dev/prefix-<upstream>   brzl-dev-quay, brzl-dev-k8s, brzl-dev-github,
#                                brzl-dev-docker-hub (ECR pull-through prefixes)
#   brzl.dev/backup-bucket       brzl-dev-cnpg-backups-<account>
#
# Selector label keeps this the ONLY cluster the generator matches (ArgoCD's
# implicit in-cluster lacks the label), so there's no duplicate.
apiVersion: v1
kind: Secret
metadata:
  name: brzl-dev-in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    brzl.dev/appset-cluster: "true"
    brzl.dev/env: dev
    brzl.dev/substrate: aws
    brzl.dev/workload-follow: release
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
