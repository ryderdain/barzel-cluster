# The service account ESO presents to OpenBao. OpenBao verifies its token with
# the cluster (Kubernetes auth, configured by driver phase 25-bootstrap) and
# grants the read-only `eso-reader` policy to this name and namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brzl-secrets-reader
  namespace: external-secrets
---
# The one store name workloads use. The provider is the HashiCorp Vault
# provider (ESO "stable"; the native openBao provider is alpha and read-only)
# pointed at OpenBao on the environment's container network, which k3d wrote
# into CoreDNS when it made the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: brzl-secrets
spec:
  provider:
    vault:
      server: http://brzl-openbao:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: brzl-secrets-reader
            namespace: external-secrets
            audiences:
              - openbao
---
# Smoke: the value driver phase 25 wrote through the store, read back by ESO.
# Phase 40's check compares the hash of the projected Secret with the hash the
# driver kept (var/run/<env>/<run>/smoke.sha256); values are never compared.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: smoke
  namespace: brzl-system
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: brzl-secrets
  target:
    name: smoke
    creationPolicy: Owner
  data:
    - secretKey: value
      remoteRef:
        key: smoke
        property: value
