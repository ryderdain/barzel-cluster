# Declarative registration of the prod cluster as an ArgoCD cluster Secret —
# same mechanics as dev (gitops/clusters/dev/in-cluster.yaml), with the prod
# values: prefixes brzl-prod-*, demo-app image brzl-prod/demo-app, bucket
# brzl-prod-cnpg-backups-<account>. Written live by the bootstrap, never in git.
apiVersion: v1
kind: Secret
metadata:
  name: brzl-prod-in-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    brzl.dev/appset-cluster: "true"
    brzl.dev/env: prod
    brzl.dev/substrate: aws
type: Opaque
stringData:
  name: in-cluster
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
