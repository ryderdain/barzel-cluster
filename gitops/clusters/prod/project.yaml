# AppProject scoping every prod Application — same constraints as dev
# (gitops/clusters/dev/project.yaml has the rationale).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: brzl-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: brzl-demo prod cluster — infrastructure, operators, applications
  sourceRepos:
    - git@github.com:ryderdain/barzel-cluster.git
    # The example app's repo (ADR-0034): private, read over https with the
    # GitHub App (the organization's repo-creds Secret, phase 25).
    - https://github.com/tzvat/chofesh.git
    - https://argoproj.github.io/argo-helm
    - https://kubernetes-sigs.github.io/aws-ebs-csi-driver
    - https://cloudnative-pg.github.io/charts
    - https://charts.external-secrets.io
    - https://charts.jetstack.io
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://charts.dexidp.io
    - https://oauth2-proxy.github.io/manifests
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  # PoC: cluster-scoped resources allowed (CRDs, StorageClass, operator
  # ClusterRoles). Tighten to an explicit allowlist as the prod posture matures.
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
