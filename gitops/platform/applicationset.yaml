# The platform ApplicationSet — ONE file for every environment (local, dev,
# prod; ADR-0025). It replaces gitops/clusters/{dev,prod}/applicationset.yaml,
# keeping their Application names, waves and AWS values (ADR-0016).
#
# Everything that differs per environment comes from the cluster Secret that the
# environment registers (gitops/clusters/<env>/in-cluster.yaml on AWS; phase
# 30-gitops on local), never from git:
#
#   labels
#     brzl.dev/appset-cluster: "true"   the generators select this Secret
#     brzl.dev/env:        local|dev|prod   AppProject brzl-<env>; prod deltas
#     brzl.dev/substrate:  k3d|aws          the AWS-only apps (EBS CSI)
#     brzl.dev/workload-follow: branch|release   how this environment follows
#                                  a workload (ADR-0034): `branch` = the
#                                  development branch's newest commit and its
#                                  image (local); `release` (the default) = the
#                                  release tag named in the element
#   annotations (written live by the bootstrap or the phase)
#     brzl.dev/registry-host       the registry the cluster pulls from
#     brzl.dev/prefix-<upstream>   path under that host per upstream
#                                  (quay, k8s, github, docker-hub): an ECR
#                                  pull-through prefix on AWS, a Zot namespace locally
#     brzl.dev/backup-bucket       CNPG backup bucket (AWS only; absent = no backup patch)
#     brzl.dev/portal-host         the admin portal's host name (its certificate)
#     brzl.dev/revision            git revision to follow (absent = main)
#     brzl.dev/auto-sync           "false" = Argo CD holds: fast mode on local,
#                                  break-glass mode anywhere (absent = sync)
#
# A helm element names its chart and a values file from this repo, and may add:
#   moreValueFiles        values files applied after valueFile
#   moreValueFilesLocal   values files applied after those, on local only
#   imageParams           chart values set to <host>/<prefix>/<path>
#   hostParams            chart values set to the registry host
#   prefixParams          chart values set to <prefix>/<path>, for a chart that
#                         takes the host separately (global.imageRegistry)
#   portalHostParams      chart values set to <prefix><the admin portal's host
#                         name><suffix>, each a map {name, prefix, suffix}
#   envParams             chart values set to the environment's name
#
# A kustomize element's path may carry __ENV__, replaced by the env label: the
# `secret-store` app renders gitops/clusters/<env>/secret-store (ADR-0026),
# and `pki` renders gitops/clusters/<env>/pki, the TLS mode's issuer (ADR-0036).
#
# A workload is an element with its own `repo` and `revision` (ADR-0034): Argo
# CD reads its manifests from that repo; this file only names the overlay and
# renames the registry host of its images, never a tag. Elements without
# `repo` are the platform's, from this repo at the cluster's brzl.dev/revision.
# The workload's element sits in a matrix with an SCM generator that gives the
# development branch's head commit (`sha`, `short_sha`); an environment with
# brzl.dev/workload-follow=branch deploys that commit and the image CI
# published for it. The workload's repo is under a GitHub organization (the
# generator lists an organization's repositories); a private one is read with
# the GitHub App that driver/access/github.sh registers (phase 25 writes it).
#
# Two matrices, unioned: every cluster gets the common apps; only clusters
# labelled brzl.dev/substrate=aws get the AWS-only ones.
#
# Guard (ADR-0016, ADR-0025): `applicationsSync: create-update` — this
# ApplicationSet never deletes an Application, so a renamed element leaves the
# old Application in place for an operator to remove on purpose; and
# `preserveResourcesOnDeletion` — deleting an Application never cascades into
# what it deployed. Phase 30-gitops also stops before it applies a change that
# would leave a live Application without an element.
#
# Sync waves (annotation, per element): -1 argocd self-manage, 0 ebs-csi+gp3,
# 1 operators (cnpg, external-secrets, cert-manager, monitoring) and the log
# stack (log-store-admin, log-store-diagnostic, log-collector; ADR-0027), 2
# secret-store, pki and sign-on-secrets, 3 sign-on (dex, oauth2-proxy;
# ADR-0035) and the example app (with its own Postgres Cluster), 4 the admin
# portal (nginx names the Services it passes to, so they must exist first).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: brzl-platform
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  brzl.dev/appset-cluster: "true"
          - list:
              # Key is `appName`, NOT `name`: in a matrix the clusters generator
              # injects `name` (= the cluster name), which would shadow a list
              # `name` (ADR-0016, lesson 1).
              elements:
                - appName: argocd
                  kind: helm
                  wave: "-1"
                  namespace: argocd
                  serverSideApply: "true"
                  chartRepo: https://argoproj.github.io/argo-helm
                  chart: argo-cd
                  # 10.11.6 = Argo CD v3.5.6 (item 13, 2026-10-29). Before:
                  # 7.7.23 = v2.13.4, the first with the login return_url fix
                  # under a base href (pass 5c).
                  chartVersion: "10.11.6"
                  valueFile: gitops/infrastructure/argocd/values.yaml
                  imageParams:
                    - name: global.image.repository
                      upstream: quay
                      path: argoproj/argocd
                    # Chart 10 takes Redis from ecr-public.aws.com, which no
                    # node mirrors; the same image is on Docker Hub.
                    - name: redis.image.repository
                      upstream: docker-hub
                      path: library/redis
                  portalHostParams:
                    - name: configs.cm.url
                      prefix: https://
                      suffix: /argocd
                - appName: cnpg-operator
                  kind: helm
                  wave: "1"
                  namespace: cnpg-system
                  serverSideApply: "true"
                  chartRepo: https://cloudnative-pg.github.io/charts
                  chart: cloudnative-pg
                  chartVersion: "0.28.2"
                  valueFile: gitops/infrastructure/cnpg/values.yaml
                  imageParams:
                    - name: image.repository
                      upstream: github
                      path: cloudnative-pg/cloudnative-pg
                - appName: external-secrets
                  kind: helm
                  wave: "1"
                  namespace: external-secrets
                  serverSideApply: "true"
                  chartRepo: https://charts.external-secrets.io
                  chart: external-secrets
                  chartVersion: "2.12.0"
                  valueFile: gitops/infrastructure/external-secrets/values.yaml
                  imageParams:
                    - name: image.repository
                      upstream: github
                      path: external-secrets/external-secrets
                    - name: webhook.image.repository
                      upstream: github
                      path: external-secrets/external-secrets
                    - name: certController.image.repository
                      upstream: github
                      path: external-secrets/external-secrets
                - appName: cert-manager
                  kind: helm
                  wave: "1"
                  namespace: cert-manager
                  serverSideApply: "true"
                  chartRepo: https://charts.jetstack.io
                  chart: cert-manager
                  chartVersion: "v1.21.2"
                  valueFile: gitops/infrastructure/cert-manager/values.yaml
                  imageParams:
                    - name: image.repository
                      upstream: quay
                      path: jetstack/cert-manager-controller
                    - name: webhook.image.repository
                      upstream: quay
                      path: jetstack/cert-manager-webhook
                    - name: cainjector.image.repository
                      upstream: quay
                      path: jetstack/cert-manager-cainjector
                    - name: acmesolver.image.repository
                      upstream: quay
                      path: jetstack/cert-manager-acmesolver
                - appName: monitoring
                  kind: helm
                  wave: "1"
                  namespace: monitoring
                  serverSideApply: "true"
                  chartRepo: https://prometheus-community.github.io/helm-charts
                  chart: kube-prometheus-stack
                  chartVersion: "86.1.1"
                  valueFile: gitops/infrastructure/monitoring/values.yaml
                  moreValueFilesLocal:
                    - gitops/infrastructure/monitoring/values-local.yaml
                  # The charts take the host once (global.imageRegistry) and
                  # each image as <prefix>/<path>.
                  hostParams:
                    - global.imageRegistry
                  prefixParams:
                    - name: prometheusOperator.image.repository
                      upstream: quay
                      path: prometheus-operator/prometheus-operator
                    - name: prometheusOperator.prometheusConfigReloader.image.repository
                      upstream: quay
                      path: prometheus-operator/prometheus-config-reloader
                    - name: prometheusOperator.admissionWebhooks.patch.image.repository
                      upstream: github
                      path: jkroepke/kube-webhook-certgen
                    - name: prometheus.prometheusSpec.image.repository
                      upstream: quay
                      path: prometheus/prometheus
                    - name: kube-state-metrics.image.repository
                      upstream: k8s
                      path: kube-state-metrics/kube-state-metrics
                    - name: prometheus-node-exporter.image.repository
                      upstream: quay
                      path: prometheus/node-exporter
                    - name: grafana.image.repository
                      upstream: docker-hub
                      path: grafana/grafana
                    - name: grafana.sidecar.image.repository
                      upstream: quay
                      path: kiwigrid/k8s-sidecar
                    - name: grafana.downloadDashboardsImage.repository
                      upstream: docker-hub
                      path: curlimages/curl
                  portalHostParams:
                    - name: grafana.grafana\.ini.server.domain
                      prefix: ""
                      suffix: ""
                    - name: grafana.grafana\.ini.auth\.generic_oauth.auth_url
                      prefix: https://
                      suffix: /dex/auth
                    - name: grafana.grafana\.ini.auth\.generic_oauth.token_url
                      prefix: https://
                      suffix: /dex/token
                    - name: grafana.grafana\.ini.auth\.generic_oauth.api_url
                      prefix: https://
                      suffix: /dex/userinfo
                # The log stack (ADR-0027): two Loki installations from one
                # chart, set apart by their values files, and the node
                # collector. The names are the Services the collector and
                # Grafana use (log-store-admin.logs.svc, ...).
                - appName: log-store-admin
                  kind: helm
                  wave: "1"
                  namespace: logs
                  serverSideApply: "false"
                  chartRepo: https://grafana.github.io/helm-charts
                  chart: loki
                  chartVersion: "7.3.0"
                  valueFile: gitops/infrastructure/logs/loki.yaml
                  moreValueFiles:
                    - gitops/infrastructure/logs/loki-admin.yaml
                  moreValueFilesLocal:
                    - gitops/infrastructure/logs/loki-admin-local.yaml
                  imageParams:
                    - name: loki.image.repository
                      upstream: docker-hub
                      path: grafana/loki
                - appName: log-store-diagnostic
                  kind: helm
                  wave: "1"
                  namespace: logs
                  serverSideApply: "false"
                  chartRepo: https://grafana.github.io/helm-charts
                  chart: loki
                  chartVersion: "7.3.0"
                  valueFile: gitops/infrastructure/logs/loki.yaml
                  moreValueFiles:
                    - gitops/infrastructure/logs/loki-diagnostic.yaml
                  imageParams:
                    - name: loki.image.repository
                      upstream: docker-hub
                      path: grafana/loki
                - appName: log-collector
                  kind: helm
                  wave: "1"
                  namespace: logs
                  serverSideApply: "false"
                  chartRepo: https://open-telemetry.github.io/opentelemetry-helm-charts
                  chart: opentelemetry-collector
                  chartVersion: "0.176.0"
                  valueFile: gitops/infrastructure/logs/collector.yaml
                  moreValueFilesLocal:
                    - gitops/infrastructure/logs/collector-local.yaml
                  imageParams:
                    - name: image.repository
                      upstream: docker-hub
                      path: otel/opentelemetry-collector-contrib
                  envParams:
                    - extraEnvs[0].value
                  # The OTLP receiver's certificate (BACKLOG 4a), a name
                  # under the portal's host, from the portal's issuer.
                  portalHostParams:
                    - name: extraManifests[0].spec.commonName
                      prefix: log-intake.
                      suffix: ""
                    - name: extraManifests[0].spec.dnsNames[0]
                      prefix: log-intake.
                      suffix: ""
                - appName: secret-store
                  kind: kustomize
                  wave: "2"
                  namespace: external-secrets
                  serverSideApply: "false"
                  # __ENV__ becomes the cluster's brzl.dev/env label: each
                  # environment keeps its own store definition (ADR-0026).
                  path: gitops/clusters/__ENV__/secret-store
                - appName: pki
                  kind: kustomize
                  wave: "2"
                  namespace: cert-manager
                  serverSideApply: "false"
                  # The environment's TLS mode: the ClusterIssuer the portal's
                  # Certificate names (ADR-0036).
                  path: gitops/clusters/__ENV__/pki
                # Sign-on (ADR-0035): the Secrets from the store, then Dex (the
                # issuer, served by the portal under /dex/) and oauth2-proxy
                # (the portal's gate). Each "localhost" in their values
                # becomes the portal's host name.
                - appName: sign-on-secrets
                  kind: kustomize
                  wave: "2"
                  namespace: sign-on
                  serverSideApply: "false"
                  path: gitops/infrastructure/sign-on/secrets
                # What each tier may do with kubectl in this environment
                # (sign-on step 2, Q182): the bindings for the groups that
                # the kube-API takes from Dex.
                - appName: access
                  kind: kustomize
                  wave: "3"
                  namespace: sign-on
                  serverSideApply: "false"
                  path: gitops/clusters/__ENV__/access
                - appName: dex
                  kind: helm
                  wave: "3"
                  namespace: sign-on
                  serverSideApply: "false"
                  chartRepo: https://charts.dexidp.io
                  chart: dex
                  chartVersion: "0.25.2"
                  valueFile: gitops/infrastructure/sign-on/dex.yaml
                  imageParams:
                    - name: image.repository
                      upstream: github
                      path: dexidp/dex
                  portalHostParams:
                    - name: config.issuer
                      prefix: https://
                      suffix: /dex
                    - name: config.connectors[0].config.redirectURI
                      prefix: https://
                      suffix: /dex/callback
                    - name: config.staticClients[0].redirectURIs[0]
                      prefix: https://
                      suffix: /oauth2/callback
                    - name: config.staticClients[1].redirectURIs[0]
                      prefix: https://
                      suffix: /argocd/auth/callback
                    - name: config.staticClients[2].redirectURIs[0]
                      prefix: https://
                      suffix: /grafana/login/generic_oauth
                - appName: oauth2-proxy
                  kind: helm
                  wave: "3"
                  namespace: sign-on
                  serverSideApply: "false"
                  chartRepo: https://oauth2-proxy.github.io/manifests
                  chart: oauth2-proxy
                  chartVersion: "10.6.2"
                  valueFile: gitops/infrastructure/sign-on/oauth2-proxy.yaml
                  moreValueFilesLocal:
                    - gitops/infrastructure/sign-on/oauth2-proxy-local.yaml
                  hostParams:
                    - image.registry
                  prefixParams:
                    - name: image.repository
                      upstream: quay
                      path: oauth2-proxy/oauth2-proxy
                  portalHostParams:
                    - name: extraArgs.oidc-issuer-url
                      prefix: https://
                      suffix: /dex
                    - name: extraArgs.redirect-url
                      prefix: https://
                      suffix: /oauth2/callback
                    - name: extraArgs.whitelist-domain
                      prefix: ""
                      suffix: ""
                    - name: extraArgs.extra-jwt-issuers
                      prefix: https://
                      suffix: /dex=argo-cd-cli
                - appName: portal
                  kind: kustomize
                  wave: "4"
                  namespace: portal
                  serverSideApply: "false"
                  path: gitops/infrastructure/portal
                  localPath: gitops/clusters/local/portal
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  brzl.dev/appset-cluster: "true"
                  brzl.dev/substrate: aws
          - list:
              elements:
                - appName: ebs-csi-driver
                  kind: helm
                  wave: "0"
                  namespace: kube-system
                  serverSideApply: "false"
                  chartRepo: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
                  chart: aws-ebs-csi-driver
                  chartVersion: "2.37.0"
                  valueFile: gitops/infrastructure/ebs-csi/values.yaml
                  imageParams:
                    - name: sidecars.provisioner.image.repository
                      upstream: k8s
                      path: sig-storage/csi-provisioner
                    - name: sidecars.attacher.image.repository
                      upstream: k8s
                      path: sig-storage/csi-attacher
                    - name: sidecars.snapshotter.image.repository
                      upstream: k8s
                      path: sig-storage/csi-snapshotter
                    - name: sidecars.resizer.image.repository
                      upstream: k8s
                      path: sig-storage/csi-resizer
                    - name: sidecars.livenessProbe.image.repository
                      upstream: k8s
                      path: sig-storage/livenessprobe
                    - name: sidecars.nodeDriverRegistrar.image.repository
                      upstream: k8s
                      path: sig-storage/csi-node-driver-registrar
    # The example app (ADR-0034), one Application per cluster: the element and
    # the SCM generator combine into one row, so the row carries the element's
    # fields and the development branch's head commit. The name must match
    # BRZL_EXAMPLE_APP_NAME and the portal's location /apps/chofesh/.
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  brzl.dev/appset-cluster: "true"
          - matrix:
              generators:
                - list:
                    elements:
                      - appName: chofesh
                        kind: kustomize
                        wave: "3"
                        namespace: chofesh
                        serverSideApply: "false"
                        # Public, read over https: no credential.
                        repo: https://github.com/tzvat/chofesh.git
                        # The release an environment with workload-follow=release
                        # runs; the manifests at that tag name the same image tag.
                        revision: v0.3.0
                        path: deploy/aws
                        localPath: deploy/local
                - scmProvider:
                    github:
                      organization: tzvat
                      allBranches: false   # the default branch only
                      # The GitHub App that phase 25 writes from the store
                      # (also Argo CD's repo-creds for the organization); a
                      # private repo needs it, a public one works without.
                      appSecretName: workload-github-app
                    filters:
                      - repositoryMatch: ^chofesh$
                    cloneProtocol: https
                    # Anonymous GitHub API calls: 60 per hour per address; a
                    # cycle costs two.
                    requeueAfterSeconds: 300
  template:
    metadata:
      name: '{{.appName}}'
      labels:
        brzl.dev/app: '{{.appName}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{.wave}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: 'brzl-{{ index .metadata.labels "brzl.dev/env" }}'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
  # The source shape is kind-dependent (Helm multi-source vs single kustomize
  # source) and the Helm parameters list is variable-length, neither of which the
  # structured template can express — so syncPolicy + sources are added here, in a
  # Go-templated patch. Every block ADDS a new spec key, so the merge onto the
  # template is purely additive.
  templatePatch: |
    {{- $ann := .metadata.annotations }}
    {{- $env := index .metadata.labels "brzl.dev/env" }}
    {{- $host := index $ann "brzl.dev/registry-host" }}
    {{- $revision := index $ann "brzl.dev/revision" | default "main" }}
    spec:
      syncPolicy:
        {{- if ne (index $ann "brzl.dev/auto-sync") "false" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
          {{- if eq .serverSideApply "true" }}
          - ServerSideApply=true
          {{- end }}
        # No limit (Q167, BACKLOG 20): a failed sync is tried again every
        # 3 minutes, so a passing fault (a DNS outage) heals by itself. A
        # real fault keeps its error visible on the Application; the retry
        # count (status.operationState.retryCount) shows how long.
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
      {{- if eq .kind "helm" }}
      sources:
        - repoURL: {{ .chartRepo }}
          chart: {{ .chart }}
          targetRevision: "{{ .chartVersion }}"
          helm:
            valueFiles:
              - $values/{{ .valueFile }}
              {{- range .moreValueFiles }}
              - $values/{{ . }}
              {{- end }}
              {{- if eq $env "local" }}
              {{- range .moreValueFilesLocal }}
              - $values/{{ . }}
              {{- end }}
              {{- end }}
            parameters:
              {{- range .imageParams }}
              - name: {{ .name }}
                value: "{{ $host }}/{{ index $ann (printf "brzl.dev/prefix-%s" .upstream) }}/{{ .path }}"
              {{- end }}
              {{- range .hostParams }}
              - name: {{ . }}
                value: "{{ $host }}"
              {{- end }}
              {{- range .prefixParams }}
              - name: {{ .name }}
                value: "{{ index $ann (printf "brzl.dev/prefix-%s" .upstream) }}/{{ .path }}"
              {{- end }}
              {{- range .portalHostParams }}
              - name: {{ .name }}
                value: "{{ .prefix }}{{ index $ann "brzl.dev/portal-host" }}{{ .suffix }}"
              {{- end }}
              {{- range .envParams }}
              - name: {{ . }}
                value: "{{ $env }}"
              {{- end }}
        - repoURL: git@github.com:ryderdain/barzel-cluster.git
          targetRevision: {{ $revision }}
          ref: values
      {{- else }}
      {{- $path := replace "__ENV__" $env .path }}
      {{- if and (eq $env "local") .localPath }}{{ $path = .localPath }}{{ end }}
      {{- $follow := index .metadata.labels "brzl.dev/workload-follow" | default "release" }}
      {{- $repo := "git@github.com:ryderdain/barzel-cluster.git" }}
      {{- $rev := $revision }}
      {{- if .repo }}{{ $repo = .repo }}{{ $rev = .revision }}{{ end }}
      {{- if and .repo (eq $follow "branch") }}{{ $rev = .sha }}{{ end }}
      sources:
        - repoURL: {{ $repo }}
          targetRevision: {{ $rev }}
          path: {{ $path }}
          kustomize:
            {{- if eq .appName "chofesh" }}
            {{- $bucket := index $ann "brzl.dev/backup-bucket" }}
            images:
              - "ghcr.io/tzvat/chofesh={{ $host }}/{{ index $ann "brzl.dev/prefix-github" }}/tzvat/chofesh{{ if eq $follow "branch" }}:{{ .short_sha }}{{ end }}"
            patches:
              - target:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Cluster
                  name: pg
                patch: |-
                  - op: replace
                    path: /spec/imageName
                    value: {{ $host }}/{{ index $ann "brzl.dev/prefix-github" }}/cloudnative-pg/postgresql:17.2
                  {{- if $bucket }}
                  - op: replace
                    path: /spec/backup/barmanObjectStore/destinationPath
                    value: s3://{{ $bucket }}/
                  {{- end }}
            {{- if eq $env "prod" }}
              - target:
                  version: v1
                  kind: Service
                  name: chofesh
                patch: |-
                  - op: replace
                    path: /spec/type
                    value: NodePort
                  - op: add
                    path: /spec/ports/0/nodePort
                    value: 30080
            {{- end }}
            {{- else if eq .appName "portal" }}
            images:
              - "nginxinc/nginx-unprivileged={{ $host }}/{{ index $ann "brzl.dev/prefix-docker-hub" }}/nginxinc/nginx-unprivileged"
            patches:
              - target:
                  group: cert-manager.io
                  version: v1
                  kind: Certificate
                  name: portal
                patch: |-
                  - op: replace
                    path: /spec/commonName
                    value: {{ index $ann "brzl.dev/portal-host" }}
                  - op: replace
                    path: /spec/dnsNames/0
                    value: {{ index $ann "brzl.dev/portal-host" }}
            {{- end }}
      {{- end }}
