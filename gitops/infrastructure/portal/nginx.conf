# The admin portal's nginx (ADR-0028): the landing page at /, and one
# location for each service, passed to that service's ClusterIP. Each service
# is told its sub-path in its own settings (Argo CD: server.rootpath), so
# nothing is rewritten here. The upstream names are fixed, so nginx starts only
# when those Services exist: the portal is the last sync wave.
#
# TLS: the certificate paths hold a variable, so nginx opens the files at each
# handshake instead of once at start, and a renewed certificate from
# cert-manager is served as soon as the Secret volume updates (no reload).
#
# Sign-on (ADR-0035, Q171): nginx asks oauth2-proxy about each request
# (auth_request). Without a session the browser goes to sign in, through
# Dex to GitHub. Outside the gate: Dex and oauth2-proxy themselves, Argo
# CD's public settings (the CLI reads them before it signs in), and the
# workloads (Q144). The CLI passes the gate with its token from Dex, which
# it sends in a header named "token"; the gate sees it as a bearer.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $host $tls { default tls; }

    # The Argo CD CLI sends its token from Dex in a header named "token",
    # not as a bearer, and the gate reads only the bearer. For the gate's
    # subrequest, that header becomes the bearer (found 2026-10-27).
    map $http_token $brzl_gate_authorization {
        ""      $http_authorization;
        default "Bearer $http_token";
    }

    # Plain HTTP, pod-local only: the readiness probe.
    server {
        listen 8080;
        location = /healthz { return 200 'ok'; }
        location / { return 404; }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        ssl_certificate /etc/nginx/tls/$tls.crt;
        ssl_certificate_key /etc/nginx/tls/$tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Every proxy header is set here, once. A location that sets any
        # proxy_set_header of its own inherits none of these: then Host
        # would be the Service's name, and Grafana refuses the browser's
        # origin ("origin not allowed"). The websocket headers serve the
        # Argo CD and Grafana UIs; they are harmless for the others.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 300s;

        # nginx's own redirects stay relative. An absolute one would carry
        # the container's port (8443), not the one the browser used.
        absolute_redirect off;

        # The gate, for every location that does not turn it off.
        auth_request /oauth2/auth;
        error_page 401 = @sign_in;

        location = /oauth2/auth {
            internal;
            auth_request off;
            proxy_pass http://oauth2-proxy.sign-on.svc:80;
            proxy_pass_request_body off;
            # Own headers here, so all of them: a location that sets one
            # inherits none from the server.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $brzl_gate_authorization;
        }

        location @sign_in {
            return 302 /oauth2/sign_in?rd=$scheme://$host$request_uri;
        }

        # oauth2-proxy's own pages: sign in, the callback from Dex, sign out.
        location /oauth2/ {
            auth_request off;
            proxy_pass http://oauth2-proxy.sign-on.svc:80;
        }

        # Dex, the issuer (https://<host>/dex); it serves itself under /dex.
        location /dex/ {
            auth_request off;
            proxy_pass http://dex.sign-on.svc:5556;
        }

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # Argo CD serves itself under /argocd (server.rootpath); the UI, the
        # API and the CLI's gRPC-web all pass through here.
        location /argocd/ {
            proxy_pass http://argocd-server.argocd.svc:80;
        }

        # Public in Argo CD too: the sign-on settings, which `argocd login
        # --sso` reads before it has a token. The CLI reads them over
        # gRPC-web (the second path), the browser over REST (the first).
        location = /argocd/api/v1/settings {
            auth_request off;
            proxy_pass http://argocd-server.argocd.svc:80;
        }
        location = /argocd/cluster.SettingsService/Get {
            auth_request off;
            proxy_pass http://argocd-server.argocd.svc:80;
        }

        # Grafana serves itself under /grafana/ (serve_from_sub_path); it
        # checks that the browser's origin is the Host it receives.
        location /grafana/ {
            proxy_pass http://monitoring-grafana.monitoring.svc:80;
        }

        # The example app (chofesh, ADR-0034): its page has relative links
        # only, so the prefix is stripped here and nothing is rewritten. A
        # workload gets its route the same way: one location, its Service.
        # Workloads are outside sign-on (Q144).
        location /apps/chofesh/ {
            auth_request off;
            proxy_pass http://chofesh.chofesh.svc:80/;
        }
    }
}
