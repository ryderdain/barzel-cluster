# The way in. ClusterIP here; each environment's overlay decides how the
# outside reaches it (local: a NodePort that k3d maps to a host port; a cloud:
# the Gateway API, pass 8).
apiVersion: v1
kind: Service
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
spec:
  # No fixed address here. The overlay for the local substrate (gitops/clusters/<env>/portal)
  # sets one, as a stand-in for public DNS on a laptop (sign-on step 2,
  # Q186); an environment with public DNS needs none.
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: https
      port: 443
      targetPort: https
