# kube-prometheus-stack values (chart 86.1.1, appVersion v0.91.0), for every
# substrate (Q158, ADR-0027 amendment): metrics, and the one Grafana, which
# also reads the two log stores.
#
# Registry (ADR-0016 pattern): the ApplicationSet injects the registry host
# once as `global.imageRegistry` (hostParams) and puts the upstream's prefix
# in front of each image path below (prefixParams): an ECR pull-through
# prefix on AWS (brzl-<env>-quay, ...), a Zot namespace on local (quay.io,
# ...). So the paths here are the upstream paths, and no environment has its
# own copy of this file. Docker Hub (Grafana, curl) needs the docker-hub
# pull-through rule and its credential on AWS. __ECR_REGISTRY_HOST__ is a
# documentation sentinel, overridden at render.
#
# Substrate differences go into values-<substrate>.yaml (moreValueFilesLocal
# in the ApplicationSet for local). Storage takes the cluster's default
# storage class: gp3 on AWS (EBS CSI, wave 0), local-path on k3d.
global:
  imageRegistry: __ECR_REGISTRY_HOST__

# CRDs are large; applied server-side (ServerSideApply set on this app in the
# ApplicationSet) to avoid the kubectl last-applied-annotation size limit.
crds:
  enabled: true

# Trimmed (decision 2026-06-04): no notification receiver is wired, so Alertmanager
# is off to save resources on the 3-node cluster. Re-enable by flipping this true.
alertmanager:
  enabled: false

# Not a Windows cluster.
windowsMonitoring:
  enabled: false

prometheusOperator:
  image:
    repository: prometheus-operator/prometheus-operator
  prometheusConfigReloader:
    image:
      repository: prometheus-operator/prometheus-config-reloader
  admissionWebhooks:
    patch:
      image:
        repository: jkroepke/kube-webhook-certgen

prometheus:
  prometheusSpec:
    image:
      repository: prometheus/prometheus
    # Scrape monitors cluster-wide, not just chart-release-labeled ones — so CNPG's
    # PodMonitor (enabled on the pg Cluster) is discovered without a release label.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    # Persist the TSDB on the default storage class (gp3 on AWS) so metrics
    # survive a pod reschedule.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

kube-state-metrics:
  image:
    repository: kube-state-metrics/kube-state-metrics
  # Each Argo CD Application's sync retries, for the alert below (Q168,
  # BACKLOG 20): brzl_argocd_app_sync_retries{name, phase, sync}. The count
  # and the phase stay on the Application after the operation ends, even
  # when the resources converge later (seen 2026-10-22: Failed, 5, but
  # Synced). So the alert counts only an Application that is not Synced.
  # Also the creation time of each ClusterRoleBinding, for the alert on a
  # break-glass hold (ADR-0037): brzl_clusterrolebinding_created{name}; the
  # alert reads brzl-break-glass, which exists only during a hold. The
  # built-in collector for bindings is off in this chart.
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: argoproj.io
              version: v1alpha1
              kind: Application
            metricNamePrefix: brzl_argocd_app
            labelsFromPath:
              name: [metadata, name]
              phase: [status, operationState, phase]
              sync: [status, sync, status]
            metrics:
              - name: sync_retries
                help: Failed attempts of the Application's latest sync operation
                each:
                  type: Gauge
                  gauge:
                    path: [status, operationState, retryCount]
                    nilIsZero: true
          - groupVersionKind:
              group: rbac.authorization.k8s.io
              version: v1
              kind: ClusterRoleBinding
            resourcePlural: clusterrolebindings
            metricNamePrefix: brzl_clusterrolebinding
            labelsFromPath:
              name: [metadata, name]
            metrics:
              - name: created
                help: Creation time of the ClusterRoleBinding (Unix seconds)
                each:
                  type: Gauge
                  gauge:
                    path: [metadata, creationTimestamp]
  rbac:
    extraRules:
      - apiGroups: [argoproj.io]
        resources: [applications]
        verbs: [list, watch]
      - apiGroups: [rbac.authorization.k8s.io]
        resources: [clusterrolebindings]
        verbs: [list, watch]

prometheus-node-exporter:
  image:
    repository: prometheus/node-exporter

grafana:
  # The admin user's password comes from the in-cluster Secret grafana-admin
  # (never in git). On local, ESO projects it from the cluster secret store,
  # where phase 25 makes the password once (values-local.yaml, Q105). On AWS,
  # the bootstrap creates it (BOOTSTRAP.md) until the AWS store exists (pass
  # 8). A fixed Secret, because the chart's own `adminPassword` default is a
  # `randAlphaNum` that changes on every render, so it would drift from
  # Grafana's database (401). Since sign-on (Q175) no login uses it: the
  # login form and basic auth are off.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: true   # the kube/node/workload dashboards = system visibility
  # Served under the admin portal's /grafana/ (ADR-0028). The ApplicationSet
  # injects the portal's host name as server.domain (portalHostParams).
  # Sign-on (ADR-0035, Q171): Grafana is a client of Dex and signs people
  # in itself; it trusts no header. The ApplicationSet replaces "localhost"
  # in the three URLs with the portal's host name. The client secret comes
  # from the environment (ExternalSecret grafana-oidc, sign-on/secrets/).
  # The access tiers (GitHub teams, as Dex names them) become Grafana's
  # roles; a person in no tier is refused (role_attribute_strict).
  envFromSecret: grafana-oidc
  grafana.ini:
    server:
      domain: localhost                     # replaced by the portal host
      root_url: "https://%(domain)s/grafana/"
      serve_from_sub_path: true
    auth:
      disable_login_form: true
      oauth_auto_login: true
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: GitHub
      client_id: grafana
      scopes: openid profile email groups offline_access
      auth_url: https://localhost/dex/auth
      token_url: https://localhost/dex/token
      api_url: https://localhost/dex/userinfo
      use_pkce: true
      # Dex's ID tokens last 1 hour (sign-on/dex.yaml): Grafana refreshes
      # its token with the refresh token (offline_access), and signs the
      # person out when Dex refuses the refresh.
      use_refresh_token: true
      login_attribute_path: preferred_username
      groups_attribute_path: groups
      role_attribute_path: "contains(groups[*], 'tzvat:brzl-admins') && 'Admin' || contains(groups[*], 'tzvat:brzl-operators') && 'Editor' || contains(groups[*], 'tzvat:brzl-auditors') && 'Viewer'"
      role_attribute_strict: true
  # The two log stores (ADR-0027), beside the stack's own Prometheus. The
  # names say which store each one reads (Q99).
  additionalDataSources:
    - name: Admin log store
      uid: admin-log-store
      type: loki
      access: proxy
      url: http://log-store-admin.logs.svc:3100
    - name: Diagnostic log store
      uid: diagnostic-log-store
      type: loki
      access: proxy
      url: http://log-store-diagnostic.logs.svc:3100
  image:
    repository: grafana/grafana
  # The grafana sidecar (quay) discovers the kube-prometheus-stack built-in
  # dashboards (ConfigMaps labeled grafana_dashboard) — system/node/workload views.
  sidecar:
    image:
      repository: kiwigrid/k8s-sidecar
  # The Postgres dashboard (PLAN deliverable): the official CloudNativePG dashboard
  # (grafana.com id 20417), pulled at startup by the curl downloader (routed through
  # the Docker Hub pull-through) and pointed at the stack's Prometheus datasource.
  downloadDashboards:
    enabled: true
  downloadDashboardsImage:
    repository: curlimages/curl
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: cnpg
          orgId: 1
          folder: CloudNativePG
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cnpg
  dashboards:
    cnpg:
      cloudnative-pg:
        gnetId: 20417
        revision: 1
        datasource: Prometheus
  # The volume's fsGroup handles ownership; skip the busybox initChown to drop an image.
  initChownData:
    enabled: false
  # Persistence OFF deliberately: dashboards (provisioned from files + the sidecar)
  # and the datasource (sidecar) are all declarative — Grafana's SQLite DB holds
  # nothing we need to keep, and persisting it freezes the first-boot admin password
  # (see adminPassword note above). emptyDir → the DB reinitialises from the env on
  # every boot, keeping the admin login in sync with the Secret.
  persistence:
    enabled: false

# A sync that keeps failing (Q167, Q168; BACKLOG 20). Argo CD retries a
# failed sync with no limit (10 s, then doubling to every 3 minutes), so a
# passing fault heals by itself. These alerts say when it has not: 3 failed
# attempts (about a minute) is a warning, 5 (about 5 minutes) is critical.
# They show as firing in Grafana's alert list and in Prometheus. Nothing is
# sent anywhere: no Alertmanager runs (a channel is a BACKLOG item).
additionalPrometheusRulesMap:
  brzl-gitops:
    groups:
      - name: brzl-gitops
        rules:
          - alert: BrzlSyncFailing
            expr: max by (name) (brzl_argocd_app_sync_retries{phase!="Succeeded", sync!="Synced"}) >= 3
            labels:
              severity: warning
            annotations:
              summary: "Argo CD failed to sync {{ $labels.name }} {{ $value }} times"
              description: "Read the error: kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{.status.operationState.message}'"
          - alert: BrzlSyncFailing
            expr: max by (name) (brzl_argocd_app_sync_retries{phase!="Succeeded", sync!="Synced"}) >= 5
            labels:
              severity: critical
            annotations:
              summary: "Argo CD failed to sync {{ $labels.name }} {{ $value }} times"
              description: "Read the error: kubectl -n argocd get application {{ $labels.name }} -o jsonpath='{.status.operationState.message}'"
      # Break-glass (ADR-0037, Q199): a hold has no automatic end, so a hold
      # older than 4 hours warns. The binding exists only during a hold.
      - name: brzl-break-glass
        rules:
          - alert: BrzlBreakGlassHeld
            expr: time() - brzl_clusterrolebinding_created{name="brzl-break-glass"} > 4 * 3600
            labels:
              severity: warning
            annotations:
              summary: "A break-glass hold is older than 4 hours: Argo CD holds, and the admins are cluster-admin"
              description: "End it with: bash driver/driver.sh <env> release | bash driver/kiesei.sh (docs/BREAK-GLASS.md). The record: kubectl -n argocd get secret brzl-<env>-in-cluster -o jsonpath='{.metadata.annotations.brzl\\.dev/break-glass}'"

