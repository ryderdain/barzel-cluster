# The store's keys (phase 25):
#   sign-on-github-client-id, sign-on-github-client-secret
#                         the GitHub OAuth App of the environment (Dex's
#                         connector), from driver/access/github.sh oauth_app
#   sign-on-<client>-client-secret
#                         one for each client of Dex: oauth2-proxy, argocd,
#                         grafana; made once
#   sign-on-cookie-secret oauth2-proxy's session cookie; made once
#   sign-on-issuer        https://<portal host>/dex (not a secret)
#   portal-ca             the store's CA certificate in local-ca mode (not a
#                         secret): the clients of Dex trust the portal with it
#
# Not here: Argo CD's Secret brzl-argocd-oidc, which phase 25 writes from the
# store, because argocd-server reads it only when it starts and it starts
# before External Secrets exists.
#
# Dex reads its Secret as environment variables (envFrom): the connector's
# config expands $GITHUB_CLIENT_ID and $GITHUB_CLIENT_SECRET, and each static
# client names its variable (secretEnv).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-env
  namespace: sign-on
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: brzl-secrets }
  target: { name: dex-env, creationPolicy: Owner }
  data:
    - secretKey: GITHUB_CLIENT_ID
      remoteRef: { key: sign-on-github-client-id, property: value }
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef: { key: sign-on-github-client-secret, property: value }
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef: { key: sign-on-oauth2-proxy-client-secret, property: value }
    - secretKey: ARGOCD_CLIENT_SECRET
      remoteRef: { key: sign-on-argocd-client-secret, property: value }
    - secretKey: GRAFANA_CLIENT_SECRET
      remoteRef: { key: sign-on-grafana-client-secret, property: value }
---
# oauth2-proxy's chart reads these three keys (config.existingSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: sign-on
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: brzl-secrets }
  target:
    name: oauth2-proxy
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        client-id: oauth2-proxy
  data:
    - secretKey: client-secret
      remoteRef: { key: sign-on-oauth2-proxy-client-secret, property: value }
    - secretKey: cookie-secret
      remoteRef: { key: sign-on-cookie-secret, property: value }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-ca
  namespace: sign-on
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: brzl-secrets }
  target: { name: portal-ca, creationPolicy: Owner }
  data:
    - secretKey: ca.crt
      remoteRef: { key: portal-ca, property: value }
---
# Grafana reads its client secret from the environment
# (GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, envFromSecret in monitoring/values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: brzl-secrets }
  target: { name: grafana-oidc, creationPolicy: Owner }
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef: { key: sign-on-grafana-client-secret, property: value }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-ca
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: brzl-secrets }
  target: { name: portal-ca, creationPolicy: Owner }
  data:
    - secretKey: ca.crt
      remoteRef: { key: portal-ca, property: value }
