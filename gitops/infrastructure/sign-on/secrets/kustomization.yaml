# The Secrets of sign-on (ADR-0035, pass 6a), projected by External Secrets
# from the cluster secret store (ClusterSecretStore brzl-secrets), where phase
# 25 writes them. One file for all of them, in the three namespaces that use
# them: sign-on (Dex, oauth2-proxy), argocd and monitoring (Grafana).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecrets.yaml
