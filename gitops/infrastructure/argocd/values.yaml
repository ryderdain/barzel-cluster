# argo-cd Helm values (chart 10.11.6, Argo CD v3.5.6; item 13). Non-HA
# single-replica PoC footprint; the replica knobs below are the scale-up
# levers for prod.
#
# Not set on purpose (item 13, Q221, Q227): the chart's NetworkPolicies stay
# on (chart 10 default): argocd-server is open, repo-server and Redis accept
# only Argo CD's own pods; the tracking method stays Argo CD's default,
# annotation (v3), because nothing of ours writes tracking marks.
#
# __ECR_REGISTRY_HOST__ is a sentinel: the account-bearing ECR host
# (<account>.dkr.ecr.eu-central-1.amazonaws.com) is resolved at bootstrap so no
# account id lands in git (ADR-0013). The pull-through prefix (brzl-dev-quay)
# is deterministic and committed as-is.

global:
  image:
    # ArgoCD ships one image used by all components; route it through ECR
    # pull-through (quay.io/argoproj/argocd upstream).
    repository: __ECR_REGISTRY_HOST__/brzl-dev-quay/argoproj/argocd

# Argo CD's own Dex is off: sign-on uses the platform's Dex in the namespace
# sign-on (ADR-0035, pass 6a), which Argo CD is a client of (oidc.config).
dex:
  enabled: false

redis:
  enabled: true
  # The chart's default image host (ecr-public.aws.com) is mirrored by no
  # node, so the ApplicationSet and phase 30 point redis.image.repository at
  # library/redis through the registry (Docker Hub upstream); the tag is the
  # chart's.

controller:
  replicas: 1
server:
  replicas: 1
  service:
    type: ClusterIP # no cloud LoadBalancer (cost); reached through the admin portal
repoServer:
  replicas: 1
applicationSet:
  replicas: 1

configs:
  # Sign-on (ADR-0035, Q171, Q175): Argo CD signs people in through Dex
  # itself and maps their GitHub teams to its roles; the built-in admin
  # login is off. In an emergency, use the CLI with the cluster's kubeconfig
  # (`argocd --core`). The ApplicationSet replaces "localhost" in `url` with
  # the portal's host name. oidc.config reads `$<Secret>:<key>` from the
  # Secret brzl-argocd-oidc, which phase 25 writes from the store: the
  # issuer, the client secret and, in local-ca mode, the store's CA
  # certificate. argocd-server reads it only when it starts, so phase 25
  # restarts argocd-server when the Secret changes.
  cm:
    url: https://localhost/argocd
    admin.enabled: "false"
    oidc.config: |
      name: GitHub
      issuer: $brzl-argocd-oidc:issuer
      clientID: argo-cd
      cliClientID: argo-cd-cli
      clientSecret: $brzl-argocd-oidc:clientSecret
      rootCA: $brzl-argocd-oidc:rootCA
      requestedScopes: ["openid", "profile", "email", "groups"]
  # The access tiers (Q169, Q170, Q173): the GitHub teams that Dex names as
  # groups "<org>:<team>". admins administer; operators sync and read, but
  # change no settings; auditors read everything and change nothing. A
  # signed-in person in no tier gets nothing (policy.default is empty), but
  # Dex and the portal's gate already refuse such a person.
  rbac:
    scopes: "[groups]"
    policy.default: ""
    policy.csv: |
      p, role:operator, applications, get, */*, allow
      p, role:operator, applications, sync, */*, allow
      p, role:operator, applications, action/*, */*, allow
      p, role:operator, applicationsets, get, */*, allow
      p, role:operator, logs, get, */*, allow
      p, role:operator, projects, get, *, allow
      p, role:operator, clusters, get, *, allow
      p, role:operator, repositories, get, *, allow
      g, tzvat:brzl-admins, role:admin
      g, tzvat:brzl-operators, role:operator
      g, tzvat:brzl-auditors, role:readonly
  params:
    # TLS ends at the admin portal's nginx (ADR-0028), not in-pod.
    server.insecure: true
    # The portal passes /argocd/ here unchanged; Argo CD serves itself under
    # that path (UI, API and the CLI's gRPC-web: `argocd login <host>
    # --grpc-web-root-path argocd`).
    server.basehref: /argocd
    server.rootpath: /argocd
    # Let the platform ApplicationSet set its own applicationsSync policy
    # (create-update: it never deletes an Application; ADR-0025). Without this
    # flag some Argo CD versions ignore the per-ApplicationSet policy.
    applicationsetcontroller.enable.policy.override: true
