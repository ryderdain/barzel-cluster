# The node collector (chart opentelemetry-collector; ADR-0027, Q86): one pod on
# each node, owned by the platform. It reads the node's log files and the
# cluster's events, receives OTLP from the collector beside a local cluster,
# and routes every record to the stores its route names. The routing is the
# spike's (branch spike-logs), tested in two rounds.
#
# Routes. A route list is comma-separated: drop | admin | diagnostic | cold;
# a record goes to every store it names, at the same time (Q91, Q95).
#   - The platform's own records always go to the admin log store, from this
#     config, not from an annotation, so no workload can remove them (Q90):
#     the k3s server log, the API audit log, the events, and what arrives over
#     OTLP (the run outputs and the secret store's audit log).
#   - A pod's logs take its namespace's brzl.dev/log-routes; none means
#     diagnostic. brzl.dev/log-retention (7d|30d|90d) becomes brzl.retention.
#   - Every platform record names the node of the collector that read it
#     (brzl.collector.node, structured metadata). A pod's record names its
#     own node (k8s.node.name).
#   - `cold` goes to the cold log store. On local, collector-local.yaml adds
#     it: JSON lines in a host directory (pass 6c). On a cloud it has no
#     destination until pass 8, and a record routed only to cold is dropped.
#
# The OTLP receiver (BACKLOG 4a): HTTP only, on the node's host port 4318,
# with mutual TLS. Its server certificate is log-intake.<portal host>, from
# cert-manager through the portal's issuer (the Certificate below). It
# accepts only a client certificate from the store's CA, and only the PKI
# role log-shipper signs client certificates: so only the collector beside
# a local cluster can write over OTLP. Workloads never send OTLP here
# (Q166): what arrives over OTLP is the platform's own, and the admin route
# on that intake stays correct.
#
# The ApplicationSet injects the image path (image.repository, through the
# registry), the environment's name (extraEnvs[0].value, brzl.env) and the
# certificate's name (extraManifests[0].spec.commonName, dnsNames[0]).
mode: daemonset
fullnameOverride: log-collector             # DaemonSet log-collector-agent

image:
  repository: otel/opentelemetry-collector-contrib   # replaced by the ApplicationSet
command:
  name: otelcol-contrib

extraEnvs:
  - name: BRZL_ENV
    value: unknown                          # replaced by the ApplicationSet

# Root, to read the node's log files (owned by root, mode 0640).
securityContext:
  runAsUser: 0
  runAsGroup: 0

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [pods, namespaces, nodes]
      verbs: [get, list, watch]
    - apiGroups: [apps]
      resources: [replicasets]
      verbs: [get, list, watch]
    - apiGroups: [events.k8s.io]
      resources: [events]
      verbs: [list, watch]

# The node's logs, a place for the read positions that survives a restart
# of the pod (no file is read twice), and the receiver's certificate.
extraVolumes:
  - name: intake-tls
    secret:
      secretName: log-intake-tls
  - name: varlog
    hostPath:
      path: /var/log
  - name: positions
    hostPath:
      path: /var/lib/brzl/collector
      type: DirectoryOrCreate
extraVolumeMounts:
  - name: intake-tls
    mountPath: /tls
    readOnly: true
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: positions
    mountPath: /var/lib/brzl/collector

# OTLP over HTTP only; the host port lets the collector beside a local
# cluster reach this one on the node's address. No gRPC (Q165).
ports:
  otlp:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  extensions:
    file_storage:
      directory: /var/lib/brzl/collector
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc: null
        http:
          endpoint: ${env:MY_POD_IP}:4318
          tls:
            cert_file: /tls/tls.crt
            key_file: /tls/tls.key
            client_ca_file: /tls/ca.crt
            reload_interval: 1h             # cert-manager renews the certificate
    filelog/pods:
      include: [/var/log/pods/*/*/*.log]
      start_at: beginning
      include_file_path: true
      storage: file_storage
      operators:
        - type: container                   # namespace, pod, uid, container from the path
    filelog/k3s-server:
      include: [/var/log/k3s.log]
      start_at: beginning
      storage: file_storage
      operators:
        - {type: add, field: 'resource["brzl.source"]', value: k3s-server}
    filelog/api-audit:
      include: [/var/log/kubernetes/audit/audit.log]
      start_at: beginning
      storage: file_storage
      operators:
        - {type: add, field: 'resource["brzl.source"]', value: api-audit}
    k8sobjects/events:
      auth_type: serviceAccount
      objects:
        - name: events
          group: events.k8s.io
          mode: watch                       # only events after the collector starts
  processors:
    k8sattributes:
      auth_type: serviceAccount
      filter:
        node_from_env_var: OTEL_K8S_NODE_NAME
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
      extract:
        metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
        annotations:
          - tag_name: brzl.routes
            key: brzl.dev/log-routes
            from: namespace
          - tag_name: brzl.retention
            key: brzl.dev/log-retention
            from: namespace
    # Q90: the platform's own records, to the admin log store (and cold).
    transform/platform-routes:
      error_mode: propagate
      log_statements:
        - set(resource.attributes["brzl.env"], "${env:BRZL_ENV}") where resource.attributes["brzl.env"] == nil
        - set(resource.attributes["brzl.source"], "k8s-event") where resource.attributes["brzl.source"] == nil
        # The node of the collector that read the record: which server's
        # k3s or audit log, which collector saw an event (with more nodes,
        # each one sees it), which node relayed an OTLP record.
        - set(resource.attributes["brzl.collector.node"], "${env:OTEL_K8S_NODE_NAME}")
        - set(resource.attributes["brzl.routes"], "admin,cold")
        - set(resource.attributes["brzl.retention"], "90d")
    # Pod logs: the namespace's annotation decides; none = diagnostic.
    transform/pod-routes:
      error_mode: propagate
      log_statements:
        - set(resource.attributes["brzl.source"], "pod")
        - set(resource.attributes["brzl.env"], "${env:BRZL_ENV}")
        - set(resource.attributes["brzl.routes"], "diagnostic") where resource.attributes["brzl.routes"] == nil
        # The gate's session and CSRF cookies are credentials. oauth2-proxy
        # logs every cookie of a callback without its CSRF cookie (upstream
        # debug output), so the values go before any store sees the line
        # (seen 2026-10-28). The name stays, for the diagnosis.
        - 'replace_pattern(log.body, "(_brzl_sign_on[A-Za-z0-9_]*=)[^;\\] ]+", "$$1<redacted>")'
    filter/admin-log-store:
      error_mode: propagate
      logs:
        log_record:
          - 'not IsMatch(resource.attributes["brzl.routes"], "(^|,)admin(,|$)")'
    filter/diagnostic-log-store:
      error_mode: propagate
      logs:
        log_record:
          - 'not IsMatch(resource.attributes["brzl.routes"], "(^|,)diagnostic(,|$)")'
    # Q99: each record names the store it is in.
    transform/admin-log-store:
      log_statements:
        - set(resource.attributes["brzl.store"], "admin-log-store")
    transform/diagnostic-log-store:
      log_statements:
        - set(resource.attributes["brzl.store"], "diagnostic-log-store")
  connectors:
    forward/routed: {}
  exporters:
    debug: null
    otlphttp/admin-log-store:
      endpoint: http://log-store-admin.logs.svc:3100/otlp
    otlphttp/diagnostic-log-store:
      endpoint: http://log-store-diagnostic.logs.svc:3100/otlp
  service:
    extensions: [health_check, file_storage]
    pipelines:
      traces: null
      metrics: null
      logs: null
      logs/platform-intake:
        receivers: [filelog/k3s-server, filelog/api-audit, k8sobjects/events, otlp]
        processors: [transform/platform-routes]
        exporters: [forward/routed]
      logs/pod-intake:
        receivers: [filelog/pods]
        processors: [k8sattributes, transform/pod-routes]
        exporters: [forward/routed]
      logs/admin-log-store:
        receivers: [forward/routed]
        processors: [filter/admin-log-store, transform/admin-log-store, batch]
        exporters: [otlphttp/admin-log-store]
      logs/diagnostic-log-store:
        receivers: [forward/routed]
        processors: [filter/diagnostic-log-store, transform/diagnostic-log-store, batch]
        exporters: [otlphttp/diagnostic-log-store]

# The receiver's server certificate (BACKLOG 4a). The name is replaced by
# the ApplicationSet with log-intake.<portal host>.
extraManifests:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: log-intake
      namespace: logs
      annotations:
        argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    spec:
      secretName: log-intake-tls
      commonName: log-intake.invalid
      dnsNames:
        - log-intake.invalid
      duration: 2160h    # 90 days
      renewBefore: 720h  # renew 30 days before the end
      privateKey:
        algorithm: ECDSA   # the local-ca role signs EC keys only
        size: 256
        rotationPolicy: Always
      usages:
        - server auth
      issuerRef:
        name: brzl-portal
        kind: ClusterIssuer
