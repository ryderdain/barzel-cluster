# Loki (chart grafana/loki), the values both log stores share (ADR-0027). Each
# store is its own installation with its own Application: log-store-admin and
# log-store-diagnostic, with their own values file after this one
# (loki-admin.yaml, loki-diagnostic.yaml). Single binary, one replica: no
# gateway, no caches, no canary; the collector and Grafana reach the Service
# on port 3100.
#
# The ApplicationSet sets the whole image path, through the registry
# (loki.image.repository = <host>/<prefix>/grafana/loki), so the chart's own
# registry is empty: the chart drops it anyway when the path's first part has
# a dot.
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcachedExporter:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
ruler:
  enabled: false
sidecar:
  rules:
    enabled: false

loki:
  image:
    registry: ""
    repository: grafana/loki                # replaced by the ApplicationSet
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem                        # the admin store moves it (loki-admin-local.yaml)
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  analytics:
    reporting_enabled: false
  limits_config:
    allow_structured_metadata: true
    # Q98: retention classes named by their period, from the namespace's
    # brzl.dev/log-retention (the collector copies it to brzl.retention).
    retention_stream:
      - selector: '{brzl_retention="7d"}'
        priority: 1
        period: 168h
      - selector: '{brzl_retention="30d"}'
        priority: 1
        period: 720h
      - selector: '{brzl_retention="90d"}'
        priority: 1
        period: 2160h
    # The index labels: these resource attributes, and Loki's own
    # service_name. Everything else (the pod's name, for example) is
    # structured metadata, searchable but not indexed.
    otlp_config:
      resource_attributes:
        ignore_defaults: true               # the defaults index k8s.pod.name
        attributes_config:
          - action: index_label
            attributes:
              - brzl.store
              - brzl.source
              - brzl.env
              - brzl.run
              - brzl.phase
              - brzl.retention
              - k8s.namespace.name
              - k8s.container.name
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
