# SPIKE (branch spike-logs, never merged) — one Loki config for three
# installations, set apart by environment variables:
#   brzl-spike-loki-admin            admin log store; data on a host directory
#   brzl-spike-loki-diagnostic       diagnostic log store; data in a volume
#   brzl-spike-loki-admin-reader     break-glass reader of the admin data
# Run with -config.expand-env=true.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

analytics:
  reporting_enabled: false

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki                        # working state: WAL, index cache, compactor
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: ${LOKI_STORE_DIR:-/store}/chunks   # stands in for the bucket
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ingester:
  wal:
    dir: /loki/wal                          # lost with the cluster
  chunk_idle_period: ${LOKI_CHUNK_IDLE_PERIOD:-30m}
  max_chunk_age: ${LOKI_MAX_CHUNK_AGE:-2h}

limits_config:
  allow_structured_metadata: true
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  # Q98: retention classes named by their period.
  retention_stream:
    - selector: '{brzl_retention="7d"}'
      priority: 1
      period: 168h
    - selector: '{brzl_retention="30d"}'
      priority: 1
      period: 720h
    - selector: '{brzl_retention="90d"}'
      priority: 1
      period: 2160h
  otlp_config:
    resource_attributes:
      ignore_defaults: true                 # the defaults index k8s.pod.name
      attributes_config:
        - action: index_label
          attributes:
            - brzl.store
            - brzl.source
            - brzl.env
            - brzl.run
            - brzl.phase
            - brzl.retention
            - k8s.namespace.name
            - k8s.container.name

compactor:
  working_directory: /loki/compactor
  retention_enabled: ${LOKI_RETENTION_ENABLED:-true}
  delete_request_store: filesystem
